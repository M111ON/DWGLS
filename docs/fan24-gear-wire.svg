<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 6 2411.4 654.25" width="2411.4" height="654.25" font-family="'Segoe UI', system-ui, sans-serif">
  <rect x="36" y="6" width="2411.4" height="654.25" fill="#ffffff"/>
  <defs>
    <marker id="ah0" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1e1e1e"/></marker>
  </defs>
  <text x="60" y="49.2" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" fill="#1e1e1e"><tspan x="60" dy="0">FAN24 Gear Wire — KIS × Hyperbolic sync wheel (fan24_gear.h)</tspan></text>
  <rect x="60" y="120" width="300" height="240" rx="19.2" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><text x="210" y="148.65" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="210" dy="0">RING-24 — two wheels, one rim</tspan><tspan x="210" dy="17.5"></tspan><tspan x="210" dy="17.5">KIS cube wheel        8 teeth (s mod 8)</tspan><tspan x="210" dy="17.5">HYPERBOLIC axis       3 teeth (s mod 3)</tspan><tspan x="210" dy="17.5">24 = 8×3 · gcd(8,3)=1</tspan><tspan x="210" dy="17.5">→ CRT bijection s ↦ (s%8, s%3) on Z24</tspan><tspan x="210" dy="17.5"></tspan><tspan x="210" dy="17.5">split (6,4) / (12,2): lcm=12 &lt; 24</tspan><tspan x="210" dy="17.5">= FENCE — forbidden for addressing</tspan><tspan x="210" dy="17.5"></tspan><tspan x="210" dy="17.5">fg_crt:  s = dc + 8·k</tspan><tspan x="210" dy="17.5">k ≡ (dx−dc)·2 (mod 3)  ·  s ∈ [0,24)</tspan></text>
  <rect x="440" y="120" width="330" height="240" rx="19.2" fill="#ffd43b" stroke="#1e1e1e" stroke-width="2"/><text x="605" y="139.9" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="605" dy="0">★ GEAR EVENT — replaces 16 b {from,to}</tspan><tspan x="605" dy="17.5"></tspan><tspan x="605" dy="17.5">Δ = (to − from + 144) % 144</tspan><tspan x="605" dy="17.5">Δ = 24·q + r</tspan><tspan x="605" dy="17.5"></tspan><tspan x="605" dy="17.5">FREE = { q:3b | dc:3b | dx:2b }</tspan><tspan x="605" dy="17.5">     = 8 b/event</tspan><tspan x="605" dy="17.5">RIM  = { q:3b }  = 3 b/event</tspan><tspan x="605" dy="17.5">  (every Δ ≡ 0 mod 24 → header 1 b)</tspan><tspan x="605" dy="17.5"></tspan><tspan x="605" dy="17.5">dc = r % 8  (cube wheel)</tspan><tspan x="605" dy="17.5">dx = r % 3  (axis wheel)</tspan><tspan x="605" dy="17.5">HOME tooth Δ=0 → emits nothing</tspan></text>
  <rect x="850" y="120" width="300" height="240" rx="19.2" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><text x="1000" y="139.9" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="1000" dy="0">ENTER ANYWHERE — KIS doctrine</tspan><tspan x="1000" dy="17.5"></tspan><tspan x="1000" dy="17.5">wire stores Δ only — NO absolute seed</tspan><tspan x="1000" dy="17.5">reader holds its OWN cur_w, then</tspan><tspan x="1000" dy="17.5">fg_reconstruct() walks BACKWARD:</tspan><tspan x="1000" dy="17.5">  out[i] = (out[i+1] − Δ[i+1]) % 144</tspan><tspan x="1000" dy="17.5"></tspan><tspan x="1000" dy="17.5">lossless from ANY entry point</tspan><tspan x="1000" dy="17.5">replay forward reproduces every</tspan><tspan x="1000" dy="17.5">intermediate scale exactly</tspan><tspan x="1000" dy="17.5"></tspan><tspan x="1000" dy="17.5">SEAL 0xFF = chain terminator</tspan><tspan x="1000" dy="17.5">(unreachable: bit7 always 0)</tspan></text>
  <path d="M 360 240 L 440 240" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/>
  <path d="M 770 240 L 850 240" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/>
  <text x="417" y="228.4" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#495057"><tspan x="417" dy="0">s = CRT(dc,dx)</tspan></text>
  <text x="822" y="228.4" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#495057"><tspan x="822" dy="0">Δ log</tspan></text>
  <rect x="60" y="400" width="1090" height="180" rx="14.4" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/><text x="60" y="411.2" text-anchor="start" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e"><tspan x="60" dy="0">BIT LAYOUT — little-endian on disk</tspan><tspan x="60" dy="17.5"></tspan><tspan x="60" dy="17.5">FREE (8 b/event):</tspan><tspan x="60" dy="17.5">    7   6 5 4   3 2 1 0          Δ = q×24 + CRT(dc,dx)</tspan><tspan x="60" dy="17.5">  ┌───┬───────┬───────┐          header 1 b declares RIM mode</tspan><tspan x="60" dy="17.5">  │ dx│  dc   │   q   │</tspan><tspan x="60" dy="17.5">  │ 2b│  3b   │  3b   │          RIM (3 b): {q} — all Δ ≡ 0 (mod 24)</tspan><tspan x="60" dy="17.5">  └───┴───────┴───────┘</tspan><tspan x="60" dy="17.5"></tspan><tspan x="60" dy="17.5">FGF2 full field (20736): q:10b → FREE 15 b/event (vs 28 b {from,to} baseline = 53.6%)</tspan><tspan x="60" dy="17.5">· RIM 10 b (35.7%) · SEAL 0xFF unreachable (bit7 always 0)</tspan></text>
  <text x="60" y="630.4" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#495057"><tspan x="60" dy="0">Proof: tools/fan24_gear_probe.c mesh identity G1–G7 12/12 · tools/fan24_gear_sync_probe.c delta log M1–M7 10/10 · tests: test_tess_scale_log_gear, test_ghost_gear_adapter (5 B ghost-lift scale-route entries) · gear wire Δ=12 octave identity in test_scale_bridge 35/35 · CRT verified against brute force.</tspan></text>
</svg>
