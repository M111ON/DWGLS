  <text x="60" y="49.2" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" fill="#1e1e1e"><tspan x="60" dy="0">Scale Bridge — one shared timeline (tooth = semitone = 2^(1/12))</tspan></text>
  <rect x="60" y="120" width="270" height="220" rx="17.6" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><text x="195" y="156.15" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="195" dy="0">BFS — continuous</tspan><tspan x="195" dy="17.5">seeker scale</tspan><tspan x="195" dy="17.5"></tspan><tspan x="195" dy="17.5">s ∈ [1e-6, 1.0]</tspan><tspan x="195" dy="17.5">current(s) = home×s (mod 20736·s)</tspan><tspan x="195" dy="17.5">delta(s) = home×(s−1)  ← derived</tspan><tspan x="195" dy="17.5">anchor = 5 B/block</tspan><tspan x="195" dy="17.5"></tspan><tspan x="195" dy="17.5">breath tick: 1.0 ⇄ 0.05</tspan><tspan x="195" dy="17.5">re-anchor when |delta| &gt; 127</tspan></text>
  <rect x="410" y="120" width="300" height="220" rx="17.6" fill="#ffd43b" stroke="#1e1e1e" stroke-width="2"/><text x="560" y="156.15" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="560" dy="0">★ THE BRIDGE</tspan><tspan x="560" dy="17.5">(core/scale_bridge.h)</tspan><tspan x="560" dy="17.5"></tspan><tspan x="560" dy="17.5">1 tooth = 1 semitone = ×2^(1/12)</tspan><tspan x="560" dy="17.5"></tspan><tspan x="560" dy="17.5">teeth(s) = −12·log2(s)</tspan><tspan x="560" dy="17.5">s(W) = 2^(−W/12)</tspan><tspan x="560" dy="17.5">W = teeth mod 144</tspan><tspan x="560" dy="17.5"></tspan><tspan x="560" dy="17.5">zero hash · zero lookup · pure math</tspan></text>
  <rect x="790" y="120" width="270" height="220" rx="17.6" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><text x="925" y="182.4" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="925" dy="0">TESS — discrete gear ring</tspan><tspan x="925" dy="17.5"></tspan><tspan x="925" dy="17.5">W ∈ [0,144)</tspan><tspan x="925" dy="17.5">gear event 8 b {q:3, dc:3, dx:2}</tspan><tspan x="925" dy="17.5">RIM mode 3 b (Δ ≡ 0 mod 24)</tspan><tspan x="925" dy="17.5">enter ANYWHERE · backward walk</tspan><tspan x="925" dy="17.5">scale log = passive (replay)</tspan></text>
