<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- SCALE-BRIDGE — BFS continuous seeker ⇄ tess gear ring (one timeline) -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#7aa2f7"/>
    </marker>
    <marker id="ahw" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#565f89"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="800" fill="#1a1b26"/>

  <!-- Title -->
  <text x="40" y="46" font-size="24" font-weight="700" fill="#a9b1d6">SCALE BRIDGE — BFS seeker ⇄ tess gear ring</text>
  <text x="40" y="74" font-size="15" fill="#7aa2f7">ONE timeline: 1 gear tooth = 1 semitone = ×2^(1/12) · teeth(s) = −12·log2(s) · W = teeth mod 144</text>

  <!-- ── Left: BFS (continuous) ─────────────────────────────────── -->
  <rect x="30" y="110" width="400" height="490" rx="10" fill="#1f2335" stroke="#3d59a1"/>
  <text x="48" y="140" font-size="16" font-weight="600" fill="#7aa2f7">BFS — BreathingFS seeker (continuous)</text>
  <text x="48" y="172" font-size="13.5" fill="#a9b1d6">scale s ∈ [1e-6, 1]  (home = 1.0)</text>
  <text x="48" y="198" font-size="13.5" fill="#c0caf5">space(s) = 20736·s     window(s) = 5184/s</text>
  <text x="48" y="228" font-size="13.5" fill="#f7768e">hyperbolic ⇔ window &gt; space ⇔ s &lt; 0.5</text>
  <line x1="48" y1="246" x2="410" y2="246" stroke="#3d59a1" stroke-width="1" opacity="0.5"/>
  <text x="48" y="272" font-size="13.5" fill="#c0caf5">current(s) = home × s   (mod space)</text>
  <text x="48" y="298" font-size="13.5" fill="#c0caf5">delta(s)   = home × (s − 1)   — derived</text>
  <text x="48" y="324" font-size="13.5" fill="#c0caf5">anchor = (home_pos, scale_at_write) = 5 B</text>
  <line x1="48" y1="342" x2="410" y2="342" stroke="#3d59a1" stroke-width="1" opacity="0.5"/>
  <text x="48" y="368" font-size="13.5" fill="#c0caf5">movement log = fan24 gear events (8 b)</text>
  <text x="48" y="394" font-size="13.5" fill="#c0caf5">breath: scale oscillates; |delta|&gt;127 →</text>
  <text x="48" y="420" font-size="13.5" fill="#c0caf5">re-anchor — delta layer stays int8</text>
  <line x1="48" y1="438" x2="410" y2="438" stroke="#3d59a1" stroke-width="1" opacity="0.5"/>
  <text x="48" y="466" font-size="13.5" fill="#9ece6a">W = 12 ⇔ s = 0.5 — hyperbolic BOUNDARY</text>
  <text x="48" y="494" font-size="13.5" fill="#565f89">BFS floor 1e-6 → 239.2 teeth (beyond axis)</text>
  <text x="48" y="522" font-size="13.5" fill="#565f89">read: lossless at home (delta = 0)</text>
  <text x="48" y="548" font-size="13.5" fill="#565f89">payload never moves — breathing is metadata</text>
  <text x="48" y="576" font-size="13.5" fill="#565f89">window = 5184/s scopes the address space</text>

  <!-- ── Center: the shared ladder ──────────────────────────────── -->
  <!-- y(W) = 120 + W·(10/3)   W=0→120, W=144→600 -->
  <text x="640" y="132" font-size="15" font-weight="600" fill="#7aa2f7" text-anchor="middle">THE SHARED LADDER</text>
  <text x="640" y="150" font-size="12" fill="#565f89" text-anchor="middle">13 ticks = octaves (Δ12)</text>

  <!-- hyperbolic zone below W=12 boundary (y=160) -->
  <rect x="612" y="160" width="56" height="440" fill="#f7768e" opacity="0.10"/>
  <text x="700" y="196" font-size="13" fill="#f7768e" font-weight="600">[ HYPERBOLIC ]</text>

  <line x1="640" y1="120" x2="640" y2="600" stroke="#7aa2f7" stroke-width="2"/>
  <!-- octave ticks: W = 12k, y = 120+40k -->
  <text x="608" y="125" font-size="13" fill="#a9b1d6" text-anchor="end">W=0</text>
  <text x="700" y="125" font-size="13" fill="#9ece6a">s = 1.0 · home</text>
  <text x="608" y="165" font-size="13" fill="#a9b1d6" text-anchor="end">W=12</text>
  <text x="700" y="165" font-size="13" fill="#e0af68">s = 1/2 · hyper boundary</text>
  <text x="608" y="205" font-size="13" fill="#a9b1d6" text-anchor="end">W=24</text>
  <text x="700" y="205" font-size="13" fill="#565f89">s = 1/4 · rim turn = ×4</text>
  <text x="608" y="245" font-size="13" fill="#a9b1d6" text-anchor="end">W=36</text>
  <text x="700" y="245" font-size="13" fill="#565f89">s = 1/8</text>
  <text x="608" y="285" font-size="13" fill="#a9b1d6" text-anchor="end">W=48</text>
  <text x="700" y="285" font-size="13" fill="#565f89">s = 1/16</text>
  <text x="608" y="325" font-size="13" fill="#a9b1d6" text-anchor="end">W=60</text>
  <text x="700" y="325" font-size="13" fill="#565f89">s = 1/32</text>
  <text x="608" y="365" font-size="13" fill="#a9b1d6" text-anchor="end">W=72</text>
  <text x="700" y="365" font-size="13" fill="#565f89">s = 1/64</text>
  <text x="608" y="405" font-size="13" fill="#a9b1d6" text-anchor="end">W=84</text>
  <text x="700" y="405" font-size="13" fill="#565f89">s = 1/128</text>
  <text x="608" y="445" font-size="13" fill="#a9b1d6" text-anchor="end">W=96</text>
  <text x="700" y="445" font-size="13" fill="#565f89">s = 1/256</text>
  <text x="608" y="485" font-size="13" fill="#a9b1d6" text-anchor="end">W=108</text>
  <text x="700" y="485" font-size="13" fill="#565f89">s = 1/512</text>
  <text x="608" y="525" font-size="13" fill="#a9b1d6" text-anchor="end">W=120</text>
  <text x="700" y="525" font-size="13" fill="#565f89">s = 1/1024</text>
  <text x="608" y="565" font-size="13" fill="#a9b1d6" text-anchor="end">W=132</text>
  <text x="700" y="565" font-size="13" fill="#565f89">s = 2^−11</text>
  <text x="608" y="605" font-size="13" fill="#a9b1d6" text-anchor="end">W=144</text>
  <text x="700" y="605" font-size="13" fill="#565f89">≡ W=0 (ring)</text>

  <g stroke="#7aa2f7" stroke-width="1">
    <line x1="634" y1="120" x2="646" y2="120"/>
    <line x1="634" y1="160" x2="646" y2="160"/>
    <line x1="634" y1="200" x2="646" y2="200"/>
    <line x1="634" y1="240" x2="646" y2="240"/>
    <line x1="634" y1="280" x2="646" y2="280"/>
    <line x1="634" y1="320" x2="646" y2="320"/>
    <line x1="634" y1="360" x2="646" y2="360"/>
    <line x1="634" y1="400" x2="646" y2="400"/>
    <line x1="634" y1="440" x2="646" y2="440"/>
    <line x1="634" y1="480" x2="646" y2="480"/>
    <line x1="634" y1="520" x2="646" y2="520"/>
    <line x1="634" y1="560" x2="646" y2="560"/>
    <line x1="634" y1="600" x2="646" y2="600"/>
  </g>

  <!-- deep-wrap landing W=95 (y=436.7) -->
  <line x1="612" y1="436.7" x2="668" y2="436.7" stroke="#f7768e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="700" y="441" font-size="12.5" fill="#f7768e">BFS floor 1e-6 → W=95</text>

  <!-- wrap arrow: bottom of ladder back to top -->
  <path d="M 668 600 C 700 600 728 560 728 360 C 728 160 700 138 668 138" fill="none" stroke="#565f89" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahw)"/>
  <text x="738" y="560" font-size="12" fill="#565f89">ring wraps: W = teeth mod 144</text>
  <text x="738" y="578" font-size="12" fill="#565f89">deep &gt; 2^−12 → ∞ side · s=2 → 132</text>

  <!-- ── Right: TESS gear ring (discrete) ──────────────────────── -->
  <rect x="880" y="110" width="370" height="490" rx="10" fill="#1f2335" stroke="#3d59a1"/>
  <text x="898" y="140" font-size="16" font-weight="600" fill="#7aa2f7">TESS — gear ring (discrete)</text>
  <text x="898" y="172" font-size="13.5" fill="#a9b1d6">W ∈ [0,144) · gear Δ = (to−from) mod 144</text>
  <text x="898" y="198" font-size="13.5" fill="#c0caf5">ring-24 = 8 KIS cubes × 3 hyper axes (CRT)</text>
  <text x="898" y="224" font-size="13.5" fill="#c0caf5">event = 8 b {q:3, dc:3, dx:2} · RIM = 3 b</text>
  <text x="898" y="250" font-size="13.5" fill="#9ece6a">Δ=12 = one octave (×2) · Δ=24 = rim (×4)</text>
  <line x1="898" y1="268" x2="1230" y2="268" stroke="#3d59a1" stroke-width="1" opacity="0.5"/>
  <text x="898" y="294" font-size="13.5" fill="#c0caf5">ENTER ANYWHERE: log stores Δ only — no</text>
  <text x="898" y="320" font-size="13.5" fill="#c0caf5">absolute seed; reader holds its own cur_w</text>
  <text x="898" y="346" font-size="13.5" fill="#c0caf5">and walks BACKWARD → lossless from any</text>
  <text x="898" y="372" font-size="13.5" fill="#c0caf5">entry (fg_reconstruct — gear wire)</text>
  <line x1="898" y1="390" x2="1230" y2="390" stroke="#3d59a1" stroke-width="1" opacity="0.5"/>
  <text x="898" y="416" font-size="13.5" fill="#c0caf5">ghost lift: (block_id, from_scale, to_scale)</text>
  <text x="898" y="442" font-size="13.5" fill="#c0caf5">= 5 B per scale-route entry (hyperbolic side)</text>
  <text x="898" y="468" font-size="13.5" fill="#f7768e">hyper ⇔ W &gt; 12 (s &lt; 0.5)</text>
  <text x="898" y="494" font-size="13.5" fill="#c0caf5">cap_rule_scale: block → (stride·rank+off)%144</text>
  <text x="898" y="520" font-size="13.5" fill="#c0caf5">home tooth: Δ=0 emits NOTHING (no event)</text>
  <text x="898" y="548" font-size="13.5" fill="#565f89">same wire on tess side: scale log + gear bridge</text>
  <text x="898" y="576" font-size="13.5" fill="#565f89">test_tess_scale_log_gear · ghost_gear_adapter</text>

  <!-- inter-panel arrows -->
  <line x1="430" y1="360" x2="612" y2="360" stroke="#7aa2f7" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="520" y="350" font-size="11.5" fill="#565f89" text-anchor="middle">seeker_scale(s)</text>
  <line x1="668" y1="480" x2="878" y2="480" stroke="#7aa2f7" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="772" y="470" font-size="11.5" fill="#565f89" text-anchor="middle">gear Δ (teeth)</text>

  <!-- ── Bottom banner ──────────────────────────────────────────── -->
  <rect x="30" y="640" width="1220" height="130" rx="10" fill="#16161e" stroke="#3d59a1"/>
  <text x="640" y="674" font-size="17" font-weight="700" fill="#7aa2f7" text-anchor="middle">THE BRIDGE — core/scale_bridge.h (zero hash · zero lookup · zero malloc)</text>
  <text x="640" y="706" font-size="14.5" fill="#c0caf5" text-anchor="middle">teeth(s) = −12·log2(s) · s(W) = 2^(−W/12) · W = teeth mod 144</text>
  <text x="640" y="732" font-size="13.5" fill="#a9b1d6" text-anchor="middle">named window W∈[0,144) ⇔ s∈[2^(−143/12), 1] ≈ [2.06e-4, 1] · deeper scales WRAP (∞ side)</text>
  <text x="640" y="754" font-size="13.5" fill="#a9b1d6" text-anchor="middle">12 teeth = octave ×2 · 24 teeth = rim ×4 · 144 teeth = 12 octaves = ×4096 · quantization ±2^(1/24)</text>
  <text x="640" y="778" font-size="13" fill="#9ece6a" text-anchor="middle">proof: tests/test_scale_bridge.c 35/35 PASS · mutation-checked (rate 12→24 ⇒ red) · TIER1 122/122</text>
</svg>
