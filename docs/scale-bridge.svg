  <rect x="60" y="380" width="1000" height="200" rx="16" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/><text x="60" y="391.2" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="60" dy="0">KEY ALIGNMENTS</tspan><tspan x="60" dy="17.5"></tspan><tspan x="60" dy="17.5">W=0  ⇔  s = 1.0            home · gear home tooth (Δ=0 emits nothing)</tspan><tspan x="60" dy="17.5">W=12 ⇔  s = 0.5            EXACT hyperbolic boundary (window=space ⇔ s²=¼) — hyper ⇔ W&gt;12</tspan><tspan x="60" dy="17.5">Δ=12 ⇔  ×2                 one octave — base-2, timeline-first</tspan><tspan x="60" dy="17.5">Δ=24 ⇔  ×4                 one full fan24 rim turn (q=1)</tspan><tspan x="60" dy="17.5">ring 144 ⇔ ×4096           12 octaves = 4⁶ — one full wrap</tspan><tspan x="60" dy="17.5">BFS floor 1e-6 → W=95      deep wrap (∞ side) · expansion s=2 → W=132</tspan><tspan x="60" dy="17.5">named window W∈[0,144) ⇔ s ∈ [2.06e-4, 1] — deeper scales WRAP the ring</tspan></text>
  <text x="60" y="630.4" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#495057"><tspan x="60" dy="0">Proof: tests/test_scale_bridge.c 35/35 PASS — math-oracle (octaves ×2 / ×4096 exact, ±2^(1/24) quant bound) · real-BFS integration (deltas at s(12) = manual oracle, lossless after excursion) · gear wire Δ=12 octave identity · deep-scale BIMG disk roundtrip (W=95) · mutation-checked (rate 12→24 ⇒ 8 red).</tspan></text>
